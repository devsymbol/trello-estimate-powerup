<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Estimate Power-Up Connector</title>
</head>
<body>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>
var ESTIMATE_KEY = 'estimate';

function getEstimate(t) {
  return t.get('card', 'shared', ESTIMATE_KEY);
}

TrelloPowerUp.initialize({
  // Бейдж на лицевой стороне карточки (список карточек)
  'card-badges': function (t, options) {
    return getEstimate(t).then(function (estimate) {
      if (!estimate) return [];
      return [{
        text: '⏱ ' + estimate + 'ч',
        color: 'blue'
      }];
    });
  },

  // Раздел на развороте карточки — значение оценки редактируется прямо на месте
  'card-back-section': function (t, options) {
    return {
      title: 'Estimation',
      icon: 'https://cdn-icons-png.flaticon.com/128/2088/2088617.png',
      content: {
        type: 'iframe',
        url: t.signUrl('./estimate-section.html'),
        height: 50
      }
    };
  }
});
</script>
</body>
</html>
