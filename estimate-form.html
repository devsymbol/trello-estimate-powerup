<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Оценка времени</title>
  <style>
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; padding: 12px; }
    input { width: 100%; font-size: 16px; padding: 6px; box-sizing: border-box; }
    .row { margin-bottom: 10px; }
    button { padding: 6px 14px; font-size: 14px; cursor: pointer; }
    #save { background: #0079bf; color: white; border: none; border-radius: 3px; }
    #clear { background: none; border: none; color: #6b778c; }
  </style>
</head>
<body>
  <div class="row">
    <input id="estimate" type="number" min="0" step="0.5" placeholder="Часы, например 4">
  </div>
  <div class="row">
    <button id="save">Сохранить</button>
    <button id="clear">Очистить</button>
  </div>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script>
    var t = TrelloPowerUp.iframe();
    var ESTIMATE_KEY = 'estimate';
    var input = document.getElementById('estimate');

    t.get('card', 'shared', ESTIMATE_KEY).then(function (value) {
      if (value) input.value = value;
      input.focus();
    });

    document.getElementById('save').addEventListener('click', function () {
      var value = input.value.trim();
      t.set('card', 'shared', ESTIMATE_KEY, value).then(function () {
        t.closePopup();
      });
    });

    document.getElementById('clear').addEventListener('click', function () {
      t.remove('card', 'shared', ESTIMATE_KEY).then(function () {
        t.closePopup();
      });
    });
  </script>
</body>
</html>
